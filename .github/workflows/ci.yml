name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: pipx install poetry==1.8.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-3.10-1.8.2-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-root
      - name: Run offline tests with coverage
        run: >-
          poetry run python -m pytest tests/ -v
          --ignore=tests/test_world_generator_e2e.py
          --cov=main --cov=game --cov=llm
          --cov-report=term-missing --cov-report=xml
          --junitxml=test-results.xml
      - name: Check CLI help
        run: poetry run python -m llm.generators.cli --help
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: test-reports
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: pipx install poetry==1.8.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-3.10-1.8.2-${{ hashFiles('poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-root
      - name: Run syntax and fatal-error lint
        run: poetry run flake8 . --select=E9,F63,F7,F82 --exclude=.git,.venv
